# Scénarios de validation métier, format app.engine.scenario.run_scenario(spec)
# Auteur : expert pilote (référent métier). Ce fichier fait foi pour les attentes (bloc `expect`).
# Heures en UTC. Heure légale = UTC+2 (CEST) jusqu'au 25/10/2026, puis UTC+1 (CET).
# Règles de lecture des attentes : voir docs/expert/scenarios-validation.md §5.
#
# Clés `expect` (toutes facultatives sauf flyability) :
#   flyability            go | marginal | no_go (no_go = aucun plan go/marginal pour ce déco, raisons dans rejected)
#   risk_codes            codes qui DOIVENT apparaître (plan.risks du meilleur plan, ou raisons du rejet « [CODE] … »)
#   risk_codes_forbidden  codes qui ne doivent apparaître dans AUCUN plan go/marginal
#   difficulty_min / difficulty_max   bornes sur plan.difficulty
#   flight_type           type du meilleur plan
#   flight_types_forbidden  aucun plan de ces types
#   thermal_usage_in      valeurs admises pour plan.thermal_usage
#   min_duration_min / max_duration_min   bornes sur est_duration_min du meilleur plan
#   max_altitude_m_max    plan.max_altitude_m ≤ valeur, pour tous les plans
#   landing_before_utc    window.start + est_duration_min ≤ cette heure (même jour), pour tous les plans
#   landing_before_sunset true → atterrissage estimé ≤ coucher du soleil, pour tous les plans
#   confidence_max        plan.confidence ≤ valeur
#   distance_km_min / distance_km_max   bornes sur distance_km du meilleur plan
#   first_leg_upwind_of_deg   cap du 1er segment à ± 60° de cette direction (cross)
#   rejected_reason_contains  sous-chaîne (insensible à la casse) d'une raison de rejet
#   summary_explains_duration true → summary mentionne pourquoi la durée est plus courte que demandé
#   no_route_intersects_classes  aucune AirspaceWarning intersects_route=true de ces classes
# Clé d'entrée facultative : alternate_landings (même format que landing) = atterros de secours pour le cône de finesse.
#
# --- Phase 2 (CDC §12) : scénarios S28-S32, bloc `scenarios_phase2` en fin de fichier -------------------
# Ils sont tenus hors de `scenarios` tant que le moteur ne gère pas l'horizon 15m, les balises d'atterro et
# leur tendance, le décollage libre et les atterros non officiels : la suite de tests actuelle (qui ne lit
# que `scenarios`) reste ainsi verte. Une fois le moteur prêt, le backend charge `scenarios + scenarios_phase2`.
# Le format est celui des scénarios existants, avec les ajouts minimaux suivants.
# Nouvelles clés d'entrée :
#   beacons[].trend         {window_min, speed_change_kmh, direction_change_deg, gust_max_kmh, samples}
#                           = Beacon.trend du contrat ; absente → trend null (tendance indisponible)
#   beacons[].elevation_m   peut valoir null (altitude inconnue de la source, cas Pioupiou)
#   beacons[].dem_elevation_m  altitude MNT imposée au point de la balise. Absente alors que elevation_m est null :
#                           le chargeur simule un MNT INDISPONIBLE à ce point (ctx.terrain_at → None pour cette balise)
#   mode                    classic (défaut) | custom_takeoff (= PlanRequest.mode)
#   custom_takeoff          {name, lat, lon, elevation_m, orientations, slope_pct, aspect_deg} ; remplace `takeoff`
#                           (site source "user", difficulty null). slope_pct = pente MNT moyenne sur 150 m dans la
#                           ligne de pente, aspect_deg = direction vers laquelle la pente fait face : valeurs MNT
#                           imposées, propres aux scénarios (en live : calculées sur le MNT)
#   landing_candidates      en mode custom_takeoff, remplace landing / alternate_landings : atterros possibles
#                           (format landing + champs ci-dessous) ; le moteur filtre (landing_policy, niveau,
#                           critères CDC §12.7), choisit le principal et classe les autres
#     landing_kind          official | community | field (= LandingKind)
#     size_m                {length, width} ; slope_pct ; surface ; access (texte libre)
#     community_usage       frequent | occasional | unknown
#     clearances_m          {power_line, trees_buildings, water, road} : distance (m) du bord du terrain à
#                           l'obstacle le plus proche ; null = rien dans un rayon de 500 m
#   filters.landing_policy  official_only (défaut) | include_community | include_fields
# Nouvelles clés `expect` (meilleur plan) :
#   landing_kind                  kind de l'atterro principal (landing_analysis[0].kind / landing.landing_kind)
#   landing_kinds_forbidden       aucun plan go/marginal n'utilise un atterro de ces kinds (principal ou secours)
#   landing_warnings_contains     sous-chaîne (insensible à la casse) des warnings de landing_analysis[0]
#   landing_beacon_representative true → station_readings contient une balise site_role=landing representative=true ;
#                                 false → aucune
#   landing_beacon_weight_max     weight de chaque balise site_role=landing representative ≤ valeur
#   landing_beacon_comment_contains  sous-chaîne (insensible à la casse) du comment de cette balise
#
# --- Révision 5 (CDC §14, vent sur le plané) : scénarios S33-S41, bloc `scenarios_phase3` en fin de fichier ---------
# Même principe que la phase 2 : ils sont tenus hors des blocs chargés tant que le moteur n'applique pas le §14 (vent
# rencontré par tranche et par branche, travers, crédit du vent arrière, majoration par les rafales, accélérateur,
# hauteur d'arrivée, HIGH_ARRIVAL, ZPA au vent), pour que la suite reste verte. Le backend ajoute `scenarios_phase3`
# au chargeur (tests/test_expert_scenarios.py, `_load`) EN MÊME TEMPS que le §14, avec les clés d'attente ci-dessous.
# Aucune nouvelle clé d'entrée : la réserve du Bout du Lac est une `sensitive_areas` avec flight_prohibited: true
# (géométrie : enveloppe simplifiée, 10 sommets, du polygone Biodiv'Sports 1564 de tests/fixtures).
# Coordonnées Forclaz / Doussard / Planfait / Perroix / Montmin = celles de app/fixtures/sites.json (PGE), pas les
# anciennes ancres forclaz_takeoff / doussard (3,4 km) qui restent pour S01-S32.
# Les bornes chiffrées viennent du calcul de référence du §14 (valeur centrale entre parenthèses dans les titres du
# tableau de scenarios-validation.md §2) avec une tolérance d'environ ±7 % ; les seuils de verdict (r = 0,90 et 1,0) ne
# sont jamais à moins de 0,02 de la valeur de référence.
# Nouvelles clés `expect` (meilleur plan sauf mention) :
#   glide_required_min / glide_required_max         bornes sur plan.glide.required_ratio
#   glide_available_min / glide_available_max       bornes sur plan.glide.available_ratio
#   glide_r_min / glide_r_max                       bornes sur r = required_ratio / available_ratio
#   glide_gain_vs_calm_min / glide_gain_vs_calm_max bornes sur available_ratio / calm_available_ratio
#   glide_wind_along_track_min / _max               bornes sur plan.glide.wind_along_track_kmh (+ = vent arrière)
#   glide_wind_credit_min / _max                    bornes sur plan.glide.wind_credit_kmh (part retenue dans available)
#   glide_arrival_height_min / _max                 bornes sur plan.glide.expected_arrival_height_m (non null)
#   glide_comment_contains     chaîne ou liste de chaînes : toutes présentes dans plan.glide.comment (casse ignorée)
#   briefing_contains          chaîne ou liste de chaînes : toutes présentes dans " ".join(plan.briefing) (casse ignorée)
#   risk_levels                {CODE: info | caution | danger} : niveau exact de ce Risk dans le meilleur plan
#   rejected_codes_forbidden   codes absents des raisons de rejet « [CODE] … » ET des risks de tous les plans
#   zpa_upwind_of_landing      true : le waypoint `turnpoint` « Zone de perte d'altitude » est au vent de l'atterro :
#                              angle entre le relèvement atterro → ZPA et la direction d'où vient le vent à l'atterro
#                              (plan.weather.landing.wind_10m.direction_deg) ≤ 95° (CDC §14.4 ; travers admis, jamais
#                              sous le vent). Contrôle sauté si ce vent est < 5 km/h.

