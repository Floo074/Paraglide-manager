# Scénarios de validation métier, format app.engine.scenario.run_scenario(spec)
# Auteur : expert pilote (référent métier). Ce fichier fait foi pour les attentes (bloc `expect`).
# Heures en UTC. Heure légale = UTC+2 (CEST) jusqu'au 25/10/2026, puis UTC+1 (CET).
# Règles de lecture des attentes : voir docs/expert/scenarios-validation.md §5.
#
# Clés `expect` (toutes facultatives sauf flyability) :
#   flyability            go | marginal | no_go (no_go = aucun plan go/marginal pour ce déco, raisons dans rejected)
#   risk_codes            codes qui DOIVENT apparaître (plan.risks du meilleur plan, ou raisons du rejet « [CODE] … »)
#   risk_codes_forbidden  codes qui ne doivent apparaître dans AUCUN plan go/marginal
#   difficulty_min / difficulty_max   bornes sur plan.difficulty
#   flight_type           type du meilleur plan
#   flight_types_forbidden  aucun plan de ces types
#   thermal_usage_in      valeurs admises pour plan.thermal_usage
#   min_duration_min / max_duration_min   bornes sur est_duration_min du meilleur plan
#   max_altitude_m_max    plan.max_altitude_m ≤ valeur, pour tous les plans
#   landing_before_utc    window.start + est_duration_min ≤ cette heure (même jour), pour tous les plans
#   landing_before_sunset true → atterrissage estimé ≤ coucher du soleil, pour tous les plans
#   confidence_max        plan.confidence ≤ valeur
#   distance_km_min / distance_km_max   bornes sur distance_km du meilleur plan
#   first_leg_upwind_of_deg   cap du 1er segment à ± 60° de cette direction (cross)
#   rejected_reason_contains  sous-chaîne (insensible à la casse) d'une raison de rejet
#   summary_explains_duration true → summary mentionne pourquoi la durée est plus courte que demandé
#   no_route_intersects_classes  aucune AirspaceWarning intersects_route=true de ces classes
# Clé d'entrée facultative : alternate_landings (même format que landing) = atterros de secours pour le cône de finesse.

