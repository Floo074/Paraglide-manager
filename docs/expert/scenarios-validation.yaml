scenarios:
  - id: S01
    title: "Forclaz, belle journée thermique, brise du lac"
    reference_time: "2026-07-14T12:00:00Z"
    horizon: "24h"
    filters: {difficulty: intermediate, thermals: allowed, duration_min_minutes: 60, duration_max_minutes: 120, flight_types: [local]}
    takeoff: *forclaz_takeoff
    landing: *doussard
    weather: *w_s01
    expect:
      flyability: go
      flight_type: local
      min_duration_min: 60
      max_duration_min: 120
      difficulty_min: intermediate
      difficulty_max: intermediate
      risk_codes: [VALLEY_BREEZE]
      risk_codes_forbidden: [RAIN, THUNDERSTORM, LEE_SIDE, TAILWIND, GLIDE_MARGIN]

  - id: S02
    title: "Forclaz, fin d'après-midi calme, élève"
    reference_time: "2026-07-15T09:30:00Z"
    horizon: "8h"                 # cible 17:30Z = 19:30 légale ; coucher ≈ 19:15Z
    filters: {difficulty: beginner, thermals: avoid, duration_min_minutes: 10, duration_max_minutes: 45}
    takeoff: *forclaz_takeoff
    landing: *doussard
    weather:
      <<: *w_s01
      takeoff_wind_kmh: 8
      takeoff_gust_kmh: 11
      landing_wind_kmh: 6
      landing_gust_kmh: 9
      winds_aloft: {1550: [6, 280], 2000: [10, 270], 3000: [15, 260]}
      thermal_ceiling_m: 1700
      cloud_base_m: null
      thermal_strength_ms: 0.6
      cape_j_kg: 50
      lifted_index: 4
    expect:
      flyability: go
      flight_type: local
      thermal_usage_in: [none, optional]
      min_duration_min: 11
      max_duration_min: 20
      difficulty_max: beginner
      landing_before_sunset: true
      risk_codes_forbidden: [STRONG_THERMALS, LEE_SIDE]
      flight_types_forbidden: [cross_country]

  - id: S03
    title: "Forclaz 14 h, thermiques trop forts pour un élève"
    reference_time: "2026-07-14T12:00:00Z"
    horizon: "24h"
    filters: {difficulty: beginner, thermals: allowed, duration_min_minutes: 15, duration_max_minutes: 45}
    takeoff: *forclaz_takeoff
    landing: *doussard
    weather:
      <<: *w_s01
      convection: {start: "07:00", end: "16:30"}   # pas de créneau « début de convection doux » dans [cible − 30 min, cible + 3 h]
    expect:
      flyability: no_go
      risk_codes: [STRONG_THERMALS]

  - id: S04
    title: "Forclaz, faux calme : déco sous le vent d'un flux d'ESE"
    reference_time: "2026-10-07T23:00:00Z"
