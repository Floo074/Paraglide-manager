# =========================================================================================================
# Phase 2 (CDC §12) : à charger avec `scenarios` dès que le moteur gère l'horizon 15m, les balises d'atterro
# et leur tendance, le décollage libre et les atterros non officiels (voir l'en-tête).
# =========================================================================================================
scenarios_phase2:
  - id: S28
    title: "Forclaz dans 15 min : la brise forcit à l'atterro alors que le modèle reste calme"
    reference_time: "2026-10-10T11:45:00Z"   # 13:45 légale
    horizon: "15m"                # cible 12:00Z ; arrivée ≈ 12:25-12:45Z
    filters: {difficulty: advanced, thermals: allowed, duration_min_minutes: 15, duration_max_minutes: 45, flight_types: [local]}
    takeoff: *forclaz_takeoff
    landing: *doussard
    weather: &w_s28
      takeoff_wind_kmh: 10
      takeoff_wind_dir: 280
      takeoff_gust_kmh: 14
      landing_wind_kmh: 4         # modèle calme : × 1,3 (13-17 h légales) → 5,2, rafales 9,1
      landing_wind_dir: 0
      landing_gust_kmh: 7
      winds_aloft: {1550: [10, 280], 2000: [12, 270], 3000: [18, 260]}
      thermal_ceiling_m: 2000
      cloud_base_m: 2300
      thermal_strength_ms: 1.4
      cape_j_kg: 50
      lifted_index: 4
      precipitation_mm_h: 0
      precip_prev_3h_mm: 0
      cloud_cover_pct: 30
      cloud_cover_low_pct: 10
      temperature_c: 15
      dew_point_c: 4
      convection: {start: "10:00", end: "14:30"}
    beacons:
      - {name: "Balise Forclaz", lat: 45.8125, lon: 6.2455, elevation_m: 1250, wind_speed_kmh: 11, wind_gust_kmh: 15, wind_direction_deg: 285, age_min: 4, trend: {window_min: 60, speed_change_kmh: 1, direction_change_deg: 5, gust_max_kmh: 16, samples: 15}}
      # +10 km/h en 1 h ; v_ext ≈ 12 + 10 × Δt/60 → 17-22 km/h (raf. 22-27) à l'arrivée : < 25 / 30 (advanced), ≥ 50 % du seuil
      - {name: "Doussard atterro", lat: 45.7875, lon: 6.2235, elevation_m: 452, wind_speed_kmh: 12, wind_gust_kmh: 17, wind_direction_deg: 10, age_min: 3, trend: {window_min: 60, speed_change_kmh: 10, direction_change_deg: 20, gust_max_kmh: 17, samples: 15}}
    expect:
      flyability: marginal
      risk_codes: [WIND_INCREASING]
      landing_beacon_representative: true
      risk_codes_forbidden: [NO_LANDING_BEACON, WIND_SHIFT, TAKEOFF_GUSTS, TAILWIND]

  - id: S29
    title: "Forclaz dans 15 min, aucune balise à l'atterro"
    reference_time: "2026-10-10T11:45:00Z"
    horizon: "15m"
    filters: {difficulty: intermediate, thermals: allowed, duration_min_minutes: 15, duration_max_minutes: 45, flight_types: [local]}
    takeoff: *forclaz_takeoff
    landing: *doussard
    weather:
      <<: *w_s28
      landing_wind_kmh: 6         # × 1,3 → 7,8 (39 % de 20), rafales 13
      landing_gust_kmh: 10
    beacons:                      # balise du déco cohérente (× 1,1) ; rien à l'atterro
      - {name: "Balise Forclaz", lat: 45.8125, lon: 6.2455, elevation_m: 1250, wind_speed_kmh: 11, wind_gust_kmh: 15, wind_direction_deg: 285, age_min: 4, trend: {window_min: 60, speed_change_kmh: 1, direction_change_deg: 5, gust_max_kmh: 16, samples: 15}}
    expect:
      flyability: go              # NO_LANDING_BEACON : caution NON bloquante (arrivée 14 h légales), jamais un no-go à lui seul
      risk_codes: [NO_LANDING_BEACON]
      landing_beacon_representative: false
      confidence_max: 0.915       # 0,92 × 1,1 × 0,9 ≈ 0,911 ; sans le facteur atterro on aurait 0,92 à 0,95
      risk_codes_forbidden: [WIND_INCREASING, LANDING_WIND, BEACON_MISMATCH]

  - id: S30
    title: "Forclaz dans 30 min : balise de l'atterro sans altitude connue"
    reference_time: "2026-10-10T11:30:00Z"   # 13:30 légale
    horizon: "30m"
    filters: {difficulty: intermediate, thermals: allowed, duration_min_minutes: 15, duration_max_minutes: 45, flight_types: [local]}
    takeoff: *forclaz_takeoff
    landing: *doussard
    weather:
      <<: *w_s28
      landing_wind_kmh: 6
      landing_gust_kmh: 10
    beacons:
      - {name: "Balise Forclaz", lat: 45.8125, lon: 6.2455, elevation_m: 1250, wind_speed_kmh: 11, wind_gust_kmh: 15, wind_direction_deg: 285, age_min: 4, trend: {window_min: 60, speed_change_kmh: 1, direction_change_deg: 5, gust_max_kmh: 16, samples: 15}}
      # elevation_m null et pas de dem_elevation_m → MNT indisponible : représentative grâce au nom « atterro » et à
      # 0,36 km de l'atterro, f_alt_inconnue = 0,5 → weight = w(arrivée ≥ 30 min) × 0,5 ≤ 0,35
      - {name: "Pioupiou Doussard atterro", lat: 45.7885, lon: 6.2250, elevation_m: null, wind_speed_kmh: 9, wind_gust_kmh: 13, wind_direction_deg: 5, age_min: 6, trend: {window_min: 60, speed_change_kmh: 1, direction_change_deg: 0, gust_max_kmh: 14, samples: 14}}
    expect:
      flyability: go
      landing_beacon_representative: true
      landing_beacon_weight_max: 0.35
      landing_beacon_comment_contains: "altitude"
      risk_codes_forbidden: [NO_LANDING_BEACON, BEACON_MISMATCH, WIND_INCREASING]

  - id: S31
    title: "Décollage libre (vol rando) pour un élève : seul un champ détecté est à portée"
    reference_time: "2026-09-19T08:30:00Z"
    horizon: "24h"                # cible 2026-09-20 08:30Z = 10:30 légale, avant la convection
    mode: custom_takeoff
    filters: {difficulty: beginner, thermals: avoid, duration_min_minutes: 10, duration_max_minutes: 30, flight_types: [local], landing_policy: include_fields}
    custom_takeoff: *rando_takeoff
    landing_candidates: [*rando_official_far, *rando_field]
    weather: &w_s31
      takeoff_wind_kmh: 8         # brise montante de face sur la pente SE
      takeoff_wind_dir: 135
      takeoff_gust_kmh: 12
      landing_wind_kmh: 5
      landing_wind_dir: 135
      landing_gust_kmh: 8
      winds_aloft: {1500: [8, 135], 1800: [10, 150], 2000: [12, 170], 3000: [18, 210]}
      thermal_ceiling_m: 1900
      cloud_base_m: null
      thermal_strength_ms: 1.0
      cape_j_kg: 30
      lifted_index: 5
      precipitation_mm_h: 0
      precip_prev_3h_mm: 0
      cloud_cover_pct: 10
      cloud_cover_low_pct: 0
      temperature_c: 12
      dew_point_c: 3
      convection: {start: "09:30", end: "15:00"}
    expect:
      flyability: no_go           # aucun plan : décollage libre interdit à l'élève, champ jamais proposé à ce niveau
      risk_codes: [FREE_TAKEOFF, DETECTED_FIELD]
      rejected_reason_contains: "décollage libre"

  - id: S32
    title: "Décollage libre (vol rando) pour un brevet confirmé : atterro communautaire à portée"
    reference_time: "2026-09-19T08:30:00Z"
    horizon: "24h"
    mode: custom_takeoff
    filters: {difficulty: advanced, thermals: avoid, duration_min_minutes: 10, duration_max_minutes: 30, flight_types: [local], landing_policy: include_community}
    custom_takeoff: *rando_takeoff
    # 1,6 km face au vent (8 km/h) : finesse de calcul 8,5 × 0,72 × 29/37 × 0,90 ≈ 4,3 ; requise 1600 / (1500 − 800 − 120) ≈ 2,8
    landing_candidates: [*rando_official_far, *rando_community, *rando_field]   # le champ est exclu par landing_policy
    weather: *w_s31
    expect:
      flyability: go
      flight_type: local
      landing_kind: community
      landing_kinds_forbidden: [field]
      landing_warnings_contains: "Non officiel"
      difficulty_min: intermediate
      difficulty_max: advanced
      risk_codes: [FREE_TAKEOFF, UNOFFICIAL_LANDING]   # tous deux en info pour advanced
      risk_codes_forbidden: [DETECTED_FIELD, GLIDE_MARGIN, TAILWIND, CROSSWIND, TAKEOFF_WIND]

# =========================================================================================================
# Révision 5 (CDC §14, vent sur le plané) : à charger avec `scenarios + scenarios_phase2` dès que le moteur applique
# le §14 (voir l'en-tête). Valeurs centrales du calcul de référence du §14 en commentaire de chaque scénario.
# =========================================================================================================
scenarios_phase3:
  - id: S33
    title: "Forclaz → Doussard, flux de N et brise du lac : le vent arrière porte le plané (brevet de pilote)"
    reference_time: "2026-09-12T00:00:00Z"
    horizon: "12h"                # cible 12:00Z = 14:00 légale ; arrivée ≈ 14:15 (brise × 1,3 : 13 km/h de N)
    filters: {difficulty: intermediate, thermals: avoid, duration_min_minutes: 10, duration_max_minutes: 20, flight_types: [local]}
    takeoff: *forclaz_pge
    landing: *doussard_pge
    weather: *w_n13
    # Référence §14 : vent rencontré 13 km/h du 354° → 10,8 dans le dos, 7,1 de travers ; crédit 0,60 + 0,20 (brise
    # établie) = 0,80 → 8,6 km/h ; finesse 8,26 (calme 6,80, × 1,21) ; requise 5,94 → r = 0,72 ; arrivée ≈ 370 m.
    expect:
      flyability: go
      flight_type: local
      thermal_usage_in: [none]
      risk_codes: [HIGH_ARRIVAL]
      risk_levels: {HIGH_ARRIVAL: info}
      risk_codes_forbidden: [GLIDE_MARGIN, TAILWIND, LEE_SIDE]
      glide_required_min: 5.8
      glide_required_max: 6.1
      glide_available_min: 7.8
      glide_available_max: 8.8
      glide_gain_vs_calm_min: 1.15
      glide_wind_along_track_min: 9.0
      glide_wind_along_track_max: 13.0
      glide_wind_credit_min: 7.5
      glide_wind_credit_max: 10.05      # plafond brevet de pilote : 10 km/h
      glide_arrival_height_min: 330
      glide_arrival_height_max: 430
      glide_comment_contains: ["dans le dos", "arrivée haute"]
      briefing_contains: "au vent de l'atterro"
      zpa_upwind_of_landing: true

  - id: S34
    title: "Forclaz → Doussard autour de la réserve du Bout du Lac, N 9 km/h, élève : passe aisément"
    reference_time: "2026-09-26T00:00:00Z"
    horizon: "12h"                # cible 12:00Z = 14:00 légale
    filters: {difficulty: beginner, thermals: avoid, duration_min_minutes: 10, duration_max_minutes: 20}
    takeoff: *forclaz_pge
    landing: *doussard_pge
    weather: *w_n9
    sensitive_areas: [*bout_du_lac]
    # Référence §14 : chemin 4,38 km (contournement par l'E et le S) → requise 6,33 ; 7,7 dans le dos ; crédit élève
    # 0,50 + 0,20 (brise établie) = 0,70 → 5,4 km/h ; finesse 7,70 (× 1,13) → r = 0,82 ; arrivée ≈ 310 m.
    # Par calme strict, le même plané donne r ≈ 0,93 (S35).
    expect:
      flyability: go
      flight_type: local
      difficulty_max: beginner
      risk_codes_forbidden: [GLIDE_MARGIN, SENSITIVE_AREA, TAILWIND]
      glide_required_min: 6.2
      glide_required_max: 6.5
      glide_available_min: 7.3
      glide_available_max: 8.1
      glide_r_max: 0.88
      glide_gain_vs_calm_min: 1.08
      glide_wind_along_track_min: 6.0
      glide_wind_along_track_max: 10.0
      glide_wind_credit_min: 3.5
      glide_wind_credit_max: 7.0
      glide_comment_contains: ["dans le dos", "contourn"]
      briefing_contains: "hors de la zone « Réserve naturelle nationale du Bout du Lac"
      zpa_upwind_of_landing: true

  - id: S35
    title: "Forclaz → Doussard autour de la réserve, calme strict, élève : sans aucune réserve de calcul"
    reference_time: "2026-09-26T00:00:00Z"
    horizon: "12h"
    filters: {difficulty: beginner, thermals: avoid, duration_min_minutes: 10, duration_max_minutes: 20}
    takeoff: *forclaz_pge
    landing: *doussard_pge
    weather:
      <<: *w_n9
      takeoff_wind_kmh: 4
      takeoff_wind_dir: 290
      takeoff_gust_kmh: 7
      landing_wind_kmh: 3
      landing_wind_dir: 0
      landing_gust_kmh: 5
